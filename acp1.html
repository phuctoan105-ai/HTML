<!DOCTYPE html>
<html lang="en">
<head>
   <style>
    body{
        margin:none;
        font-family:cursive;
    }
    .a{
        overflow:hidden;
        background-color:aliceblue;

    }
    .a a{
        float:left;
        color:rgb(43, 220, 226);
        padding:14px 16px;
        text-decoration:none;

        font-size: 17px;
    }
    .a a:hover{
        background-color:rgb(94, 255, 0);
        color:rgb(20, 190, 220);

    }
    .a a.active{
        background-color:rgb(243, 35, 28);
        color:rgb(230, 245, 250);
    }
   </style>
</head>
<body>
    <div class="a">
        <a class="active" href="#home">Home</a>
        <a href="#">About</a>
        <a href="#">Gallery</a>
        <a href="#">Contact us</a>

    <section>
  <img class="mySlides" src="https://images.ctfassets.net/j8tkpy1gjhi5/5OvVmigx6VIUsyoKz1EHUs/b8173b7dcfbd6da341ce11bcebfa86ea/Salami-pizza-hero.jpg" style="height:500px; width:500px;">
  <img class="mySlides" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSZf84AwzNFBxiL_4GuY0EMRQ3fCjIgYd5eI7mUevHRdL-VVR7lPGn-tf2Z&s=10" style="height:500px; width:500px;">
  <img class="mySlides" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT5yUT-akcbb3nnuwvk8TdUxWlPAIkqrs3UqUZPGNC_eMM-M-H9pEFIvNGD&s=10" style="height:500px; width:500px;">
</section>

<script>

var myIndex = 0;
carousel();

function carousel() {
  var i;
  var x = document.getElementsByClassName("mySlides");
  for (i = 0; i < x.length; i++) {
    x[i].style.display = "none";
  }
  myIndex++;
  if (myIndex > x.length) {myIndex = 1}
  x[myIndex-1].style.display = "block";
  setTimeout(carousel, 3000);
}
</script>

</body>
</html>
