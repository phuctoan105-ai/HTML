<head>
   <style>
    body{

    .a{

<body>

    <div class="d">
        <div class="e">

        </div>
    </div>
    
    <script>
        var myIndex = 0;
        carousel();
        function carousel(){
            var i;
            var x = document.getElementsByClassName("b");
            for (i=0; i < x.length; i++){
                x[i].style.display="none";
            }
            myIndex++;
            if(myIndex > x.length){myIndex = 1};
            x[myIndex-1].style.display="block";
            setTimeout(carousel,3000);
        }
        
    </script>
