<!DOCTYPE html>
<html lang="en">
<head>
   <style>
    body{
        margin:none;
        font-family:cursive;
    }
    .a{
        overflow:hidden;
        background-color:aliceblue;

    }
    .a a{
        float:left;
        color:blueviolet;
        padding:14px 16px;
        text-decoration:none;
        text-align: center;
        font-size: 17px;
    }
    .a a:hover{
        background-color:aqua;
        color:crimson;

    }
    .a a.active{
        background-color:plum;
        color:lavender;
    }
   </style>
</head>
<body>
    <div class="a">
        <a class="active" href="#home">Home</a>
        <a href="#">About</a>
        <a href="#">Gallery</a>
        <a href="#">Contact us</a>
    </div>
    <section>
        <img class="b" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTLeDfYxbGsjbdhSK4rG6p1M1Stlz4BFKQEKmd65WECoA&s=10" style="height: 500px; width:500px;">
        <img class="b" src="https://img.sonofatailor.com/images/customizer/product/extra-heavy-cotton/ss/Black.jpg" style="height:500px; width:500px;">

    </section>
    <script>
        var myIndex = 0;
        carousel();
        function carousel(){
            var i;
            var x = document.getElementsByClassName("b");
            for (i=0; i < x.length; i++){
                x[i].style.display="none";
            }
            myIndex++;
            if(myIndex > x.length){myIndex = 1};
            x[myIndex-1].style.display="block";
            setTimeout(carousel,3000);
        }
        
    </script>
</body>
</html>
